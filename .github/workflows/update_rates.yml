name: Update Savings Rates

on:
  workflow_dispatch:
    inputs:
      verify_source:
        description: 'Attempt direct HTTP verification from GitHub runner'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: revo-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify rates at source
        id: scraper
        if: github.event_name == 'workflow_dispatch' && inputs.verify_source == true
        continue-on-error: true
        run: npm start

      - name: Validate stored data and build site
        run: npm run build

      - name: Commit verification state
        if: github.event_name == 'workflow_dispatch' && inputs.verify_source == true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ! git diff --quiet -- rates.json; then
            git add rates.json
            git commit -m "chore: record savings rate verification [skip ci]"
            git push origin HEAD:main
          fi

      - name: Require existing Firebase credential
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REVO_SAVINGS_CALCULATOR }}
        run: |
          if [ -z "$FIREBASE_SECRET" ]; then
            echo "::error::Required Firebase deployment credential is missing."
            exit 1
          fi

      # Every production run deploys, even with unchanged rates or a failed source
      # check. Thus it publishes honest failure metadata and retries prior failures.
      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REVO_SAVINGS_CALCULATOR }}'
          projectId: revo-savings-calculator
          channelId: live

      - name: Verify deployed files
        if: github.event_name != 'pull_request'
        run: node scripts/verify-production.js

      - name: Report source verification failure
        if: always() && steps.scraper.outcome == 'failure'
        run: |
          echo "::error::Revolut rate verification failed. Last good rates retained; inspect deployment steps separately."
          exit 1
